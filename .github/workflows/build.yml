name: Build MobZone
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      # Paper's version format for 26.1.x is not confirmed, so try both forms.
      - name: Build (build-number style API version)
        id: a
        continue-on-error: true
        run: gradle build -PpaperApi=26.1.2.build.+ --no-daemon
      - name: Build (SNAPSHOT style API version)
        if: steps.a.outcome == 'failure'
        run: gradle build -PpaperApi=26.1.2-R0.1-SNAPSHOT --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MobZone-jar
          path: build/libs/MobZone-*.jar
      # A plain download link: Releases > "MobZone (latest build)" > the .jar files. Replaced on every build.
      - name: Publish latest build as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest build/libs/MobZone-*.jar --title "MobZone (latest build)" --notes "Built from commit ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
