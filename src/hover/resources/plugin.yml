name: MobZoneHover
version: '${version}'
main: dev.mobzone.hover.HoverPlugin
api-version: '26.1'
depend: [MobZone, packetevents]
description: Shows item worth in the hover tooltip (needs PacketEvents).
commands:
  hoverdebug:
    description: Log hover tooltip decisions to the console
    usage: /hoverdebug
    permission: mobzone.admin
