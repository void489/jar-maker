# MobZone configuration. Zones can be edited by hand, then run /mobzone reload.

settings:
  # How many blocks inside the zone wall a mob's centre must stay.
  edge-margin: 0.4
  # Knockback toward a wall is scaled down smoothly inside this many blocks.
  knockback-guard: 4.0
  # Within this many blocks of a wall, a path heading outward is cancelled.
  edge-band: 1.5
  # Ticks between checks of tracked mobs (only spawner mobs are checked).
  check-interval-ticks: 4
  # When creating a zone without explicit Y values, extend the top by this much.
  y-extend-up: 6
  # Last-resort fix: move a mob that is outside back to the nearest inside point.
  snap-on-breach: true

zones: {}
# Example:
# zones:
#   cellblock:
#     world: prison
#     pos1: {x: -25, y: 100, z: -31}
#     pos2: {x: 25, y: 110, z: -70}
#     spawners: [walker1, walker2]

# Timed boss events. One boss at a time, from a random zone, announced in chat.
# The key under 'bosses' must match a MobZone zone name. x/y/z is where the boss appears.
boss:
  enabled: true
  interval-minutes: 60          # a new boss every hour
  despawn-minutes: 30           # an unkilled boss leaves after this long
  min-damage-share: 0.05        # need at least 5% of the boss's health in damage to earn a reward
  min-players: 1                # only spawn if this many players are in the prison world
  warnings-seconds: [300, 60, 10]
  bosses:
    cellblock: {mob: BOSS_wardenzombie, name: "&cWarden Zombie", x: 0.5, y: 101, z: -51.5, reward: 2500}
    cafeteria: {mob: BOSS_headchef, name: "&6Head Chef", x: 0.5, y: 101, z: -92.5, reward: 6000}
    laundry: {mob: BOSS_foreman, name: "&eForeman", x: 0.5, y: 101, z: -132.5, reward: 12000}
    infirmary: {mob: BOSS_chiefsurgeon, name: "&aChief Surgeon", x: 0.5, y: 101, z: -172.5, reward: 25000}
    yard: {mob: BOSS_brutus, name: "&9Warden Brutus", x: 0.5, y: 101, z: -212.5, reward: 50000}
    sewers: {mob: BOSS_sludgeking, name: "&2Sludge King", x: 0.5, y: 101, z: -252.5, reward: 100000}
    lab: {mob: BOSS_drmortem, name: "&dDr. Mortem", x: 0.5, y: 101, z: -292.5, reward: 200000}
    quarantine: {mob: BOSS_specimen0, name: "&5Specimen Zero", x: 0.5, y: 101, z: -332.5, reward: 400000}
    subbasement: {mob: BOSS_patientzero, name: "&4&lPatient Zero", x: 0.5, y: 101, z: -372.5, reward: 1000000}

# Infinite night vision with no particles and no HUD icon, only in these worlds.
night-vision:
  enabled: true
  worlds: [prison]

# Extra cash on every zombie kill: percent-per-rank x (rank number - 1). Rank A = 0%, Z = 25 x 2% = +50%.
# Payouts below must match the 'eco give' amounts in your MythicMobs mob files.
rank-bonus:
  enabled: true
  # true = MobZone pays the whole kill reward (base + bonus) in ONE payment. Remove the 'eco give' lines from the
  # MythicMobs zombie files when this is true (mobs-nopay.zip does that), or players get paid twice.
  pay-base: true
  percent-per-rank: 2.0
  # Permanent bonus per prestige level (prestige_1..prestige_10 LuckPerms groups).
  percent-per-prestige: 10.0

# Chat line "[Prestige] Name: message". Your rank letter already comes from your prefix. Use {rank} here to add it again. enabled: false keeps the old chat format.
chat:
  enabled: true
  format: "&#C084FC{prestige}"

# ---------------------------------------------------------------- crates
# Players open these from /crates (Bio Tokens). Reward types: cash, tokens, booster, command.
# weight = relative chance. broadcast: true announces the win to everyone. {player} works in command rewards.
crates:
  common:
    name: "&7Common Crate"
    cost: 20
    rewards:
      - {weight: 50, type: cash, amount: 100000}
      - {weight: 30, type: cash, amount: 500000}
      - {weight: 12, type: tokens, amount: 10}
      - {weight: 6, type: booster, multiplier: 1.5, minutes: 10}
      - {weight: 2, type: cash, amount: 5000000, broadcast: true}
  rare:
    name: "&9Rare Crate"
    cost: 75
    rewards:
      - {weight: 45, type: cash, amount: 2000000}
      - {weight: 30, type: cash, amount: 10000000}
      - {weight: 12, type: tokens, amount: 60}
      - {weight: 8, type: booster, multiplier: 2.0, minutes: 15}
      - {weight: 4, type: cash, amount: 100000000, broadcast: true}
      - {weight: 1, type: tokens, amount: 300, broadcast: true}
  legendary:
    name: "&6&lLegendary Crate"
    cost: 250
    rewards:
      - {weight: 40, type: cash, amount: 50000000}
      - {weight: 30, type: cash, amount: 250000000}
      - {weight: 14, type: tokens, amount: 250}
      - {weight: 10, type: booster, multiplier: 2.0, minutes: 30}
      - {weight: 5, type: cash, amount: 2000000000, broadcast: true}
      - {weight: 1, type: tokens, amount: 1500, broadcast: true}

# ---------------------------------------------------------------- daily quests
# Each player gets per-day random quests they are eligible for (min-kills = their total kills needed).
# type: kills (any zombie), mob (a specific MythicMobs name), boss (take part in a boss fight).
quests:
  enabled: true
  per-day: 3
  pool:
    - {id: kills_100, desc: "Kill 100 zombies", type: kills, target: 100, cash: 20000, tokens: 2, min-kills: 0}
    - {id: kills_300, desc: "Kill 300 zombies", type: kills, target: 300, cash: 100000, tokens: 4, min-kills: 600}
    - {id: kills_800, desc: "Kill 800 zombies", type: kills, target: 800, cash: 500000, tokens: 8, min-kills: 3000}
    - {id: kills_2000, desc: "Kill 2,000 zombies", type: kills, target: 2000, cash: 3000000, tokens: 15, min-kills: 13500}
    - {id: walker_60, desc: "Kill 60 Walkers", type: mob, mob: Walker, target: 60, cash: 15000, tokens: 2, min-kills: 0}
    - {id: runner_40, desc: "Kill 40 Runners", type: mob, mob: Runner, target: 40, cash: 15000, tokens: 2, min-kills: 0}
    - {id: brute_40, desc: "Kill 40 Brutes", type: mob, mob: Brute, target: 40, cash: 60000, tokens: 3, min-kills: 175}
    - {id: cook_40, desc: "Kill 40 Cooks", type: mob, mob: Cook, target: 40, cash: 100000, tokens: 3, min-kills: 600}
    - {id: stoker_40, desc: "Kill 40 Stokers", type: mob, mob: Stoker, target: 40, cash: 200000, tokens: 4, min-kills: 1500}
    - {id: spitter_40, desc: "Kill 40 Spitters", type: mob, mob: Spitter, target: 40, cash: 400000, tokens: 5, min-kills: 3200}
    - {id: guard_40, desc: "Kill 40 Guards", type: mob, mob: Guard, target: 40, cash: 800000, tokens: 6, min-kills: 8000}
    - {id: mutant_30, desc: "Kill 30 Mutants", type: mob, mob: Mutant, target: 30, cash: 2000000, tokens: 8, min-kills: 27000}
    - {id: elite_25, desc: "Kill 25 Elites", type: mob, mob: Elite, target: 25, cash: 5000000, tokens: 12, min-kills: 88000}
    - {id: boss_1, desc: "Take part in a boss fight", type: boss, target: 1, cash: 100000, tokens: 5, min-kills: 175}

# ---------------------------------------------------------------- timed events
# Every interval-minutes a random event starts and runs for duration-minutes (only if players are online).
events:
  enabled: true
  interval-minutes: 180
  duration-minutes: 15
  min-players: 1
  types:
    double_cash: {name: "&6Double Cash", cash: 2.0, tokens: 1.0}
    bio_rush: {name: "&bBio Rush", cash: 1.0, tokens: 2.0}
    frenzy: {name: "&dFrenzy", cash: 1.5, tokens: 1.5}

# ---------------------------------------------------------------- welcome (first join only)
welcome:
  enabled: true
  open-guide: true
  title: "&#A855F7&lWELCOME"
  subtitle: "&7Survive the Dead Cell Block"
  messages:
    - "&#A855F7&lWelcome, {player}!"
    - "&7Kill zombies for cash, then &f/rankup &7to climb."
    - "&7Type &f/guide &7any time to see your next step."

# ---------------------------------------------------------------- donor bonus (extra % cash per kill)
# Players get the highest one they have. These are LuckPerms groups.
donor-bonus:
  donor_vip: 10
  donor_plus: 20
  donor_elite: 30
