name: MobZone
version: '${version}'
main: dev.mobzone.MobZonePlugin
api-version: '26.1'
depend: [MythicMobs]
softdepend: [PlaceholderAPI]
description: Keeps MythicMobs spawner mobs inside cuboid zones.
commands:
  mobzone:
    description: Manage mob zones
    usage: /mobzone <pos1|pos2|create|delete|list|info|addspawner|removespawner|update|set|reload>
    aliases: [mz]
  quests:
    description: Show your daily quests
    usage: /quests
  events:
    description: Show the current server event
    usage: /events
  keys:
    description: Show your crate keys
    usage: /keys
  claim:
    description: Claim cash won from crates
    usage: /claim
  promote:
    description: Move a staff member up one role
    usage: /promote <player>
    permission: mobzone.promote
  demote:
    description: Move a staff member down one role
    usage: /demote <player>
    permission: mobzone.promote
  keyall:
    description: Give crate keys to everyone online
    usage: /keyall <crate|all> [amount]
    permission: mobzone.keyall
permissions:
  mobzone.bypass.worldcommands:
    description: Use prison commands in any world
    default: false
  mobzone.promote:
    description: Use /promote and /demote
    default: op
  mobzone.keyall:
    description: Use /keyall
    default: op
  mobzone.admin:
    description: Use /mobzone
    default: op
