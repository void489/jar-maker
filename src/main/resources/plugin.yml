name: MobZone
version: '${version}'
main: dev.mobzone.MobZonePlugin
api-version: '26.1'
depend: [MythicMobs]
softdepend: [PlaceholderAPI]
description: Keeps MythicMobs spawner mobs inside cuboid zones.
commands:
  mobzone:
    description: Manage mob zones
    usage: /mobzone <pos1|pos2|create|delete|list|info|addspawner|removespawner|update|set|reload>
    aliases: [mz]
  quests:
    description: Show your daily quests
    usage: /quests
  events:
    description: Show the current server event
    usage: /events
  keys:
    description: Show your crate keys
    usage: /keys
permissions:
  mobzone.admin:
    description: Use /mobzone
    default: op
